# Isolated nested-session test configuration for clothcursor.
# Deliberately contains no user autostart commands or plugin autoload.

monitor = , 800x600@60, auto, 1

input {
    follow_mouse = 1
    sensitivity = 0
}

cursor {
    inactive_timeout = 0
    hide_on_key_press = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
}

decoration {
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

bind = SUPER, ESCAPE, exit
